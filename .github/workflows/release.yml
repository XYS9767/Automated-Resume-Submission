name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install verified build dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Run regression and local browser tests
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Build and verify portable executable
        shell: pwsh
        run: python build_release.py --version $env:GITHUB_REF_NAME.Substring(1)
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File | ForEach-Object FullName)
          $assets += (Resolve-Path -LiteralPath dist/SHA256SUMS.txt).Path
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --title "BOSS Auto Apply $env:GITHUB_REF_NAME (Windows x64)" --notes-file packaging/release-notes.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
